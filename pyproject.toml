[project]
name = "red-team-harness"
version = "0.1.0"
description = "Automated Red-Team Harness for AI safety testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pygithub>=2.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# Non-Python runtime files must be shipped in the wheel, otherwise an installed
# copy (pip install . / Docker) starts with an empty attack battery and a
# broken dashboard.
"src.attacks" = ["seeds/*.yaml"]
"src.dashboard" = ["templates/*.html"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately kept, not bugs:
#   B008  — FastAPI's Depends()/Query() in argument defaults is the framework idiom.
#   BLE001/S110 — the harness intentionally catches broad exceptions around target
#           calls, the LLM judge, and GitHub so one failure never aborts a run.
#   ASYNC230 — the only blocking open() is one-time YAML seed loading at startup.
ignore = ["B008", "BLE001", "S110", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
